<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>使用者故事｜拯救狗狗大作戰</title>
  <meta name="description" content="跟著 RehabVerse 的警探解開魔法箱，用記憶與復健救出可愛的狗狗。" />
  <meta name="theme-color" content="#0c0416" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Space Grotesk,Arial' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500;700;900&family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Film grain / noise texture overlay -->
  <div class="grain" aria-hidden="true"></div>
  <!-- Twinkling starfield -->
  <div class="stars" aria-hidden="true"></div>
  <div class="stars stars-2" aria-hidden="true"></div>
  <div class="stars stars-bright" aria-hidden="true"></div>

  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img class="logo-img" src="logo.png" alt="RehabVerse" />
      </a>
      <a href="index.html" class="btn btn-ghost nav-cta">返回首頁</a>
    </div>
  </header>

  <main>
    <section class="story" id="top">
      <div class="story-head">
        <span class="tag">User Story</span>
        <h1 class="story-title">拯救狗狗大作戰</h1>
        <p class="story-lead">跟著警探解開魔法箱，用記憶與復健救出可愛的狗狗。</p>
      </div>

      <div class="story-viewer">
        <button class="story-nav prev" id="prevBtn" aria-label="上一張">‹</button>

        <figure class="story-card">
          <div class="story-imgwrap">
            <img class="story-img" id="storyImg" src="1.png" alt="故事場景" />
            <!-- 第三頁互動：把畫面往左／往右掰來輸入方向 -->
            <div class="story-game" id="storyGame" hidden>
              <div class="game-arrow left" id="arrowLeft">◀</div>
              <div class="game-arrow right" id="arrowRight">▶</div>
              <div class="game-bottom">
                <p class="game-hint" id="gameHint">把畫面往左或往右轉，輸入密碼</p>
                <div class="game-slots" id="gameSlots">
                  <span class="slot" data-answer="左"></span>
                  <span class="slot" data-answer="右"></span>
                  <span class="slot" data-answer="右"></span>
                  <span class="slot" data-answer="左"></span>
                </div>
                <p class="game-result" id="gameResult"></p>
              </div>
            </div>
          </div>
          <figcaption class="story-caption">
            <span class="story-chapter" id="storyChapter">第一章 · 發現藏身處</span>
            <p class="story-text" id="storyText"></p>
          </figcaption>
        </figure>

        <button class="story-nav next" id="nextBtn" aria-label="下一張">›</button>
      </div>

      <div class="story-dots" id="storyDots" aria-hidden="true"></div>

      <div class="story-actions">
        <span class="story-count"><b id="pageNow">1</b> / 4</span>
      </div>
    </section>
  </main>

  <script src="story.js"></script>
</body>
</html>
